<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>资金流水核验 · 公司X光</title>
<link rel="icon" href="../assets/favicon.ico" sizes="48x48">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/theme.css">
<style>
/* 语义色统一由 theme.css 提供（3.0.0）：硬红/软红/黄/绿各只认一支 */
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:var(--x-ink);background:var(--x-bg)}

.top{background:var(--x-top-bg);color:var(--x-top-ink);padding:20px 28px 22px;
     border-bottom:1px solid var(--x-top-line)}
.top h1{margin:0;font-size:18px;letter-spacing:-.2px;font-weight:700}
\.top p{margin:8px 0 0;color:var(--x-top-muted);font-size:13.5px;line-height:1.75;max-width:820px}
.wrap{max-width:1560px;margin:0 auto;padding:20px 28px 40px}

/* 概览 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--x-card);border:1px solid var(--x-line);border-radius:var(--x-r-md);padding:15px 17px 14px}
.stat span{display:block;font-size:11.5px;color:var(--x-dot);margin-bottom:5px;letter-spacing:.06em;font-weight:600}
.stat b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.stat.bad b{color:var(--x-bad)}
.stat.good b{color:var(--x-ok)}

/* 双栏 */
.cols{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pane{background:var(--x-card);border:1px solid var(--x-line);border-radius:var(--x-r-md);overflow:hidden;box-shadow:var(--x-card-shadow)}
.pane-head{padding:15px 18px;border-bottom:1px solid var(--x-line);font-weight:800;font-size:14.5px;
           display:flex;justify-content:space-between;align-items:center;color:var(--x-ink)}
.pane-head small{font-weight:500;color:var(--x-dot);font-size:12px}

/* 流水条目 */
.flow{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--x-line);cursor:pointer;
      transition:background .13s;align-items:flex-start}
.flow:last-child{border-bottom:0}
.flow:hover{background:var(--x-kpi-bg)}
.flow.on{background:var(--x-nav-on);box-shadow:inset 3px 0 0 var(--x-brand)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:var(--x-ok)}
.flow.red_hard .dot{background:var(--x-bad)}.flow.red_soft .dot{background:var(--x-grey)}.flow.yellow .dot{background:var(--x-grey)}
.flow-main{flex:1;min-width:0}
.flow-path{font-size:13px;font-weight:700;line-height:1.55;word-break:break-word}
.flow-path .arrow{color:var(--x-dot);margin:0 4px;font-weight:400}
.flow-meta{margin-top:5px;font-size:11.5px;color:var(--x-dot);display:flex;gap:10px;flex-wrap:wrap}
.flow-amt{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--x-ink)}
.flow.red_hard .flow-amt{color:var(--x-bad)}.flow.red_soft .flow-amt{color:var(--x-grey)}

/* 详情 */
.detail{padding:18px 19px 20px}
.empty{padding:52px 24px;text-align:center;color:var(--x-dot);font-size:13.5px;line-height:1.8}
.verdict{border-radius:13px;padding:16px 17px;margin-bottom:16px;border:1px solid}
.verdict.red_hard{background:var(--x-sev-bg-bad);border-color:var(--x-bad)}
.verdict.red_soft{background:var(--x-sev-bg-warn);border-color:var(--x-grey)}
.verdict.yellow{background:var(--x-sev-bg-warn);border-color:var(--x-grey)}
.verdict.green{background:var(--x-sev-bg-ok);border-color:var(--x-ok)}
.vhead{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.badge{border-radius:var(--x-r-xs);padding:4px 11px;font-size:11.5px;font-weight:800;
       background:var(--x-sev-bg-bad);color:var(--x-bad)}
.red_soft .badge{background:var(--x-sev-bg-warn);color:var(--x-grey)}
.yellow .badge{background:var(--x-sev-bg-warn);color:var(--x-grey)}
.green .badge{background:var(--x-sev-bg-ok);color:var(--x-ok)}
.score{margin-left:auto;font-size:12px;color:var(--x-dot);font-variant-numeric:tabular-nums}
.vtitle{font-size:15.5px;font-weight:800;line-height:1.5;word-break:break-word}
.vamount{margin-top:7px;font-size:26px;font-weight:900;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.vadvice{margin-top:10px;font-size:13.5px;line-height:1.72;color:var(--x-ink)}

.sec-h{font-size:12px;font-weight:800;color:var(--x-dot);letter-spacing:.6px;margin:16px 0 9px;text-transform:uppercase}
.sig{display:grid;grid-template-columns:22px 1fr;gap:9px;padding:11px 0;border-top:1px solid var(--x-line)}
.sig:first-of-type{border-top:0}
.sig-ico{font-size:14px;line-height:1.5}
.sig-name{font-size:13.5px;font-weight:800;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:800;border-radius:var(--x-r-xs);padding:2px 7px;
    background:var(--x-sev-bg-ok);color:var(--x-ok)}
.tag.bad{background:var(--x-sev-bg-bad);color:var(--x-bad)}
.tag.unknown{background:var(--x-kpi-bg);color:var(--x-muted)}
.sig-ev{font-size:12.5px;color:var(--x-muted);line-height:1.7}
.sig-raw{font-size:11.5px;color:var(--x-dot);margin-top:4px;line-height:1.6}

.links{display:grid;gap:7px}
.link{background:var(--x-kpi-bg);border:1px solid var(--x-line);border-radius:var(--x-r-sm);padding:9px 11px;font-size:12.5px;line-height:1.6}
.link b{font-weight:800}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--x-sev-bg-bad);border:1px solid var(--x-bad);
       border-radius:var(--x-r-sm);padding:12px 13px;font-size:12.5px;line-height:1.5}
.chain .node{background:var(--x-card);border:1px solid var(--x-bad);border-radius:var(--x-r-xs);padding:5px 9px;font-weight:700}
.chain .ar{color:var(--x-bad);font-weight:800}

/* 手动核验 */
.manual{margin-top:18px;background:var(--x-card);border:1px solid var(--x-line);border-radius:15px;padding:19px}
.manual h2{margin:0 0 6px;font-size:16px}
.manual p{margin:0 0 14px;font-size:12.5px;color:var(--x-muted);line-height:1.7}
.form-row{display:grid;grid-template-columns:1fr 1fr 150px auto;gap:9px;align-items:center}
@media(max-width:860px){.form-row{grid-template-columns:1fr}}
.form-row input{border:1.5px solid var(--x-line);border-radius:var(--x-r-sm);padding:11px 12px;font-size:13.5px;
                font-family:inherit;outline:none;transition:border-color .16s;background:var(--x-card);color:var(--x-ink)}
.form-row input:focus{border-color:var(--x-brand)}
.btn{border:0;border-radius:var(--x-r-sm);padding:11px 20px;background:var(--x-brand);color:#fff;font-weight:800;
     cursor:pointer;font-family:inherit;font-size:13.5px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.94)}
.btn:disabled{opacity:.55;cursor:wait}
.msg{margin-top:12px;font-size:12.5px;color:var(--x-muted);line-height:1.7;min-height:18px}
.warn{background:var(--x-sev-bg-warn);border:1px solid var(--x-grey);color:var(--x-grey);border-radius:var(--x-r-sm);padding:11px 13px;
      font-size:12.5px;line-height:1.65;margin-bottom:14px;display:none}
.warn.show{display:block}
</style>
<script>
/* 主题同步（3.0.1）：本页与主站共用 theme.css 的令牌。
   偏好存在 localStorage['xray.theme']，主站设置页改的是同一个键 ——
   所以在别的页面改完主题，这页刷新就跟着变。
   默认深色：专业终端的主形态（theme.css 的 :root 就是深色值）。 */
(function () {
  try {
    var v = localStorage.getItem('xray.theme') || 'system';
    var dark = (v === 'dark') ||
      (v === 'system' && window.matchMedia &&
       window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { /* localStorage 不可用：按 theme.css 的默认值渲染 */ }
})();
</script>
</head><body>
<header class="top">
  <h1>💰 资金流水核验</h1>
  <p>看两件事：这两家公司业务上有没有上下游关系、人员股权地址有没有交集；钱出去之后有没有绕一圈回到原点。<b>行业不同不等于有问题</b>，但跨行业、查不到关联、金额又对不上经营规模，就值得先停一停。</p>
</header>
<main class="wrap">
  <div class="warn" id="offline">⚠️ 未连接到后端，正在显示离线说明。启动后端后刷新即可看到真实核验结果。</div>

  <section class="stats" id="stats">
    <div class="stat"><span>排查流水</span><b id="s-total">—</b></div>
    <div class="stat bad"><span>异常笔数</span><b id="s-bad">—</b></div>
    <div class="stat"><span>涉及金额</span><b id="s-amt">—</b></div>
    <div class="stat good"><span>未发现异常</span><b id="s-ok">—</b></div>
  </section>

  <div class="cols">
    <section class="pane">
      <div class="pane-head">资金往来明细 <small id="cnt"></small></div>
      <div id="flows"><div class="empty">正在加载…</div></div>
    </section>
    <section class="pane">
      <div class="pane-head">核验结论</div>
      <div class="detail" id="detail"><div class="empty">← 选择左侧任意一笔资金往来看核验结论</div></div>
    </section>
  </div>

  <section class="manual">
    <h2>🔍 手动核验两家主体</h2>
    <p>不依赖上面的流水：填两个公司名，直接看它们业务上是否相关、有没有公开关联。库内没有的主体只会给出"证据不足"，不会替官方下结论。</p>
    <form id="f">
      <div class="form-row">
        <input id="payer" placeholder="付款方公司全称" required>
        <input id="payee" placeholder="收款方公司全称" required>
        <input id="amount" type="number" min="1" step="1" placeholder="金额（元）" required>
        <button class="btn" type="submit">核验</button>
      </div>
    </form>
    <div class="msg" id="msg"></div>
    <div id="manualResult"></div>
  </section>
</main>
<script>
const API = "/api/v1";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const LV = {red_hard:"高风险 · 建议暂停付款", red_soft:"建议复核", yellow:"信息不足 · 请留意", green:"未发现异常"};
const ICON = {red_hard:"⛔", red_soft:"🟠", yellow:"🟡", green:"✅"};
const MARK = {pass:["通过","tag"], fail:["异常","tag bad"], none:["未知","tag unknown"]};
const money = v => "¥" + Number(v || 0).toLocaleString("zh-CN");

/* 统一超时：fetch 默认永不超时，弱网下会一直转圈（移动端踩过这个坑） */
async function api(path, opts = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(API + path, {...opts, cache: "no-store", signal: ctl.signal,
      headers: {"Content-Type": "application/json", ...(opts.headers || {})}});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    return d;
  } finally { clearTimeout(timer); }
}

function offline(on) { document.getElementById("offline").classList.toggle("show", on); }

async function boot() {
  try {
    const [sum, list] = await Promise.all([api("/fund/summary"), api("/fund/flows")]);
    offline(false);
    document.getElementById("s-total").textContent = sum.total;
    document.getElementById("s-bad").textContent = sum.abnormal;
    document.getElementById("s-amt").textContent = money(sum.amount_total);
    document.getElementById("s-ok").textContent = (sum.by_level.green || 0);
    document.getElementById("cnt").textContent = sum.total + " 笔 · 涉及 " + sum.companies + " 家主体";
    renderList(list.flows);
  } catch (e) {
    offline(true);
    document.getElementById("flows").innerHTML = '<div class="empty">后端未连接<br><small>' + esc(e.message) + "</small></div>";
  }
}

function renderList(rows) {
  document.getElementById("flows").innerHTML = rows.map(r => `
    <div class="flow ${r.level}" data-id="${esc(r.flow_id)}">
      <span class="dot"></span>
      <div class="flow-main">
        <div class="flow-path">${esc(r.payer)}<span class="arrow">→</span>${esc(r.payee)}</div>
        <div class="flow-meta">
          <span class="flow-amt">${money(r.amount)}</span>
          <span>${esc(r.date)} ${esc(r.time || "")}</span>
          <span>${esc(r.purpose || "")}</span>
        </div>
      </div>
    </div>`).join("");
  document.querySelectorAll(".flow").forEach(el => el.onclick = () => openFlow(el));
}

async function openFlow(el) {
  document.querySelectorAll(".flow").forEach(x => x.classList.toggle("on", x === el));
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="empty">正在核验…</div>';
  try { renderDetail(await api("/fund/flow/" + encodeURIComponent(el.dataset.id)), box); }
  catch (e) { box.innerHTML = '<div class="empty">核验失败：' + esc(e.message) + "</div>"; }
}

function renderDetail(v, box) {
  const sigs = (v.signals || []).map(s => {
    const k = s.pass === true ? "pass" : s.pass === false ? "fail" : "none";
    const [label, cls] = MARK[k];
    return `<div class="sig">
      <div class="sig-ico">${s.pass === true ? "✓" : s.pass === false ? "!" : "?"}</div>
      <div>
        <div class="sig-name">${esc(s.name)}<span class="${cls}">${label}</span></div>
        <div class="sig-ev">${esc(s.evidence)}</div>
        <div class="sig-raw">${s.actual ? "实际：" + esc(s.actual) : ""}${s.expected ? " ｜ 应有：" + esc(s.expected) : ""}</div>
      </div></div>`;
  }).join("");

  const links = (v.links || []).length
    ? `<div class="sec-h">主体关联（查到的直接关系）</div><div class="links">` +
      v.links.map(l => `<div class="link"><b>${esc(l.type)}</b>（${esc(l.strength)}）· ${esc(l.detail)}</div>`).join("") +
      "</div>"
    : `<div class="sec-h">主体关联</div><div class="link">法定代表人、股东、注册地址、联系电话四项均无交集</div>`;

  const cycles = (v.cycles || []).length
    ? `<div class="sec-h">资金链路（钱怎么绕回原点的）</div>` +
      v.cycles.map(c => `<div class="chain">` +
        c.chain.map(n => `<span class="node">${esc(n)}</span>`).join('<span class="ar">→</span>') +
        `<span style="color:var(--x-dot);font-size:11.5px;margin-left:6px">${c.flow_ids.map(esc).join(" · ")}</span></div>`).join("")
    : "";

  box.innerHTML = `
    <div class="verdict ${v.level}">
      <div class="vhead">
        <span class="badge">${ICON[v.level] || "⚠"} ${esc(v.level_text)}</span>
        <span class="score">健康分 ${v.score}/100</span>
      </div>
      <div class="vtitle">${esc(v.payer)}<span style="color:var(--x-dot);margin:0 6px">→</span>${esc(v.payee)}</div>
      <div class="vamount">${money(v.amount)}</div>
      <div class="vadvice">${esc(v.advice_phrase)}</div>
    </div>
    <div class="sec-h">四个维度逐条核对</div>
    ${sigs}
    ${links}
    ${cycles}`;
  box.scrollIntoView({block: "nearest", behavior: "smooth"});
}

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById("msg"), out = document.getElementById("manualResult");
  msg.textContent = "核验中…"; out.innerHTML = "";
  try {
    const v = await api("/fund/check", {method: "POST", body: JSON.stringify({
      payer: document.getElementById("payer").value.trim(),
      payee: document.getElementById("payee").value.trim(),
      amount: Number(document.getElementById("amount").value)})});
    msg.textContent = "";
    renderDetail(v, out);
  } catch (err) { msg.textContent = "核验失败：" + err.message; }
};

boot();
</script></body></html>
